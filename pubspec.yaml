name: stash_it_app
description: "Stash-it Flutter application."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.0
  dio: ^5.11.1
  retrofit: ^4.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  skeletonizer: ^3.0.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  retrofit_generator: ^10.2.12
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Display only: the wordmark, screen titles and small section labels.
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/silkscreen-400.ttf
          weight: 400
        - asset: assets/fonts/silkscreen-700.ttf
          weight: 700
    # All UI copy and saved-item content.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-var.ttf
          weight: 400
        - asset: assets/fonts/inter-var.ttf
          weight: 500
        - asset: assets/fonts/inter-var.ttf
          weight: 600
    # Machine text only: domains, URLs, timestamps, mock-data markers.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jbmono-var.ttf
          weight: 500
