workflows:
  macos-unsigned-testing:
    name: macOS unsigned testing build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      # Keep the Flutter version aligned with the project's existing SDK.
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      # Create this environment variable group in Codemagic with:
      #   API_BASE_URL              e.g. http://192.168.1.50:8080
      #   GOOGLE_DESKTOP_CLIENT_ID
      #   GOOGLE_DESKTOP_CLIENT_SECRET  (mark as a secret)
      # Do not commit any of these values to the repository.
      groups:
        - macos_oauth
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Validate macOS build configuration
        script: |
          set -e
          for name in API_BASE_URL GOOGLE_DESKTOP_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required Codemagic variable: $name"
              exit 1
            fi
          done
          if [ -z "${GOOGLE_DESKTOP_CLIENT_SECRET}" ]; then
            echo "GOOGLE_DESKTOP_CLIENT_SECRET is empty; Google sign-in will fail at runtime."
          fi

      - name: Build unsigned macOS application
        script: |
          set -e
          # Flutter passes FLUTTER_XCODE_* variables to xcodebuild. The initial
          # artifact is intentionally unsigned for M1 testing without an Apple
          # Developer Program membership.
          export FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO
          export FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO

          flutter build macos --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"

      - name: Package application for manual testing
        script: |
          set -e
          APP_DIR="build/macos/Build/Products/Release"
          if [ ! -d "$APP_DIR/stash_it_app.app" ]; then
            echo "Expected app bundle was not produced: $APP_DIR/stash_it_app.app"
            exit 1
          fi

          rm -rf "$APP_DIR/Stash-it.app"
          cp -R "$APP_DIR/stash_it_app.app" "$APP_DIR/Stash-it.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_DIR/Stash-it.app" \
            "$CM_BUILD_DIR/Stash-it-macos-unsigned.zip"
    artifacts:
      - Stash-it-macos-unsigned.zip
